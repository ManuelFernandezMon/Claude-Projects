name: cold-cap-timer CI
on:
  pull_request:
    paths: ['cold-cap-timer/**']
  push:
    branches: [main]
    paths: ['cold-cap-timer/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cold-cap-timer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

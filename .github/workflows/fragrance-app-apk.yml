name: fragrance-app APK
on:
  push:
    paths:
      - 'fragrance-app/public/**'
      - '!fragrance-app/public/data.json'
      - 'fragrance-app/mobile/**'
      - '.github/workflows/fragrance-app-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragrance-app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Launcher icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#8b2942' --iconBackgroundColorDark '#8b2942' --splashBackgroundColor '#8b2942' --splashBackgroundColorDark '#8b2942'
      - name: Stamp build number
        run: |
          echo '{ "build": ${{ github.run_number }} }' > ../public/build.json
      - run: npx cap sync android
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Use the fixed debug key (so new builds install over old ones)
        working-directory: .
        run: mkdir -p ~/.android && cp fragrance-app/mobile/debug.keystore ~/.android/debug.keystore
      - name: Bump Android version so each build counts as an update
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build debug APK
        working-directory: fragrance-app/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check the APK is signed with the committed key
        working-directory: .
        run: |
          want=$(keytool -list -keystore fragrance-app/mobile/debug.keystore -storepass android | grep -i 'SHA-256' | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          got=$($apksigner verify --print-certs fragrance-app/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA-256' | head -1 | sed 's/.*: //' | tr -d ' ')
          echo "want=$want got=$got"
          [ "$want" = "$got" ]
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tufrenperfumero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tufrenperfumero-apk
          path: fragrance-app/mobile/tufrenperfumero.apk
      - name: Publish as a GitHub release (apk-latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest tufrenperfumero.apk \
            --title "Perfumes app (Android APK) build ${{ github.run_number }}" \
            --notes "Latest debug build of the app. Install by opening this file on your Android phone. Build ${{ github.run_number }}, from commit ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"

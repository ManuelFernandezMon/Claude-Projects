<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9c3350"/>
      <stop offset="100%" stop-color="#6f2035"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6c98a"/>
      <stop offset="100%" stop-color="#c49a52"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>

  <!-- base -->
  <rect x="37" y="65" width="26" height="4" rx="2" fill="#c49a52"/>
  <!-- bottle body -->
  <rect x="35" y="41" width="30" height="26" rx="7" fill="url(#bottleGrad)"/>
  <!-- bottle neck -->
  <rect x="44" y="30" width="12" height="12" rx="2" fill="url(#bottleGrad)"/>
  <!-- atomizer bulb -->
  <circle cx="50" cy="25" r="7.5" fill="url(#bottleGrad)"/>
  <!-- nozzle -->
  <rect x="53.5" y="12" width="3.2" height="15" rx="1.6" fill="#e6c98a" transform="rotate(-28 55 24)"/>

  <!-- mist -->
  <circle cx="66" cy="12" r="2.6" fill="#f4ece0" opacity="0.95"/>
  <circle cx="73" cy="7" r="1.9" fill="#f4ece0" opacity="0.75"/>
  <circle cx="79" cy="3.5" r="1.3" fill="#f4ece0" opacity="0.55"/>
</svg>
